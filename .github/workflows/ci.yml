name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check out sibling path dependencies
        shell: bash
        run: |
          grep -oE 'path *= *"\.\./[^"]+"' Cargo.toml | sed -E 's/.*"(\.\.\/[^"]+)".*/\1/' | while read -r dep; do
            name=$(basename "$dep")
            [ -d "$dep" ] || git clone --depth 1 "https://github.com/${{ github.repository_owner }}/${name}" "$dep"
          done
      - run: cargo test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
