[package]
name = "gray-zai-sub"
version = "0.1.2"
edition = "2021"
rust-version = "1.88"
description = "Z.AI (GLM) provider sidecar plugin for the gray agent harness"
license = "MIT"

[lib]
name = "zai_sub"
path = "src/lib.rs"

[[bin]]
name = "zai-sub"
path = "src/main.rs"

[dependencies]
gray-acp-bridge = { path = "../gray-acp-bridge" }
gray-openai-compat = { path = "../gray-openai-compat" }
serde_json = { version = "1", features = ["preserve_order"] }
